services:
  kv-download:
    image: vndangkhoa/kv-download:latest
    container_name: kv-download
    restart: unless-stopped
    ports:
      - "9292:9292"
    volumes:
      - ./downloads:/download
    environment:
      - MR_DOWNLOAD_DIR=/download
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9292/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

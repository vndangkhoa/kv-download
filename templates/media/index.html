<!doctype html>
<html lang="en">
<head>
    <title>KV Download - Task Watcher & Video Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Download videos from YouTube, TikTok, Instagram, Twitter/X, Vimeo and more with real-time MeTube task watcher">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-simple">

<canvas id="matrixCanvas" class="matrix-canvas d-none"></canvas>

<div class="app-container">
    <div class="top-nav">
        <div class="brand">
            <img src="/static/logo.svg" alt="KV Download" width="32" height="32" class="app-logo">
            <span class="brand-name">KV Download</span>
        </div>
        <div class="theme-switch-group">
            <button type="button" class="btn-theme-switch active" data-theme="simple">
                <i class="bi bi-moon-stars-fill"></i> Simple
            </button>
            <button type="button" class="btn-theme-switch" data-theme="matrix">
                <i class="bi bi-terminal-fill"></i> Matrix
            </button>
        </div>
    </div>

    <main class="main-content">
        <form class="url-form" id="downloadForm">
            <div class="glass-card">
                <div class="glass-input">
                    <div class="input-icon">
                        <i class="bi bi-link-45deg"></i>
                    </div>
                    <textarea name="url" class="url-input"
                              placeholder="Paste video or playlist URL(s) here... one per line" rows="1"
                              id="urlInput" autofocus></textarea>
                    <button class="btn-download" type="submit" id="submitBtn">
                        <i class="bi bi-plus-circle"></i>
                        <span class="btn-text">Add to Queue</span>
                    </button>
                </div>

                <div class="format-bar">
                    <span class="format-label"><i class="bi bi-sliders"></i> Quality:</span>
                    <button type="button" class="format-pill active" data-format="best">Auto (Best)</button>
                    <button type="button" class="format-pill" data-format="1080p">1080p</button>
                    <button type="button" class="format-pill" data-format="720p">720p</button>
                    <button type="button" class="format-pill" data-format="480p">480p</button>
                    <button type="button" class="format-pill" data-format="audio_mp3"><i class="bi bi-music-note"></i> Audio MP3</button>
                    <button type="button" class="format-pill" data-format="audio_m4a"><i class="bi bi-music-note-beamed"></i> Audio M4A</button>
                </div>
            </div>
        </form>

        <section class="task-dashboard">
            <div class="task-tabs">
                <div class="tab-group">
                    <button type="button" class="task-tab active" data-filter="all">
                        <i class="bi bi-collection"></i> All <span class="task-tab-badge" id="countAll">0</span>
                    </button>
                    <button type="button" class="task-tab" data-filter="downloading">
                        <i class="bi bi-arrow-down-circle"></i> Active <span class="task-tab-badge" id="countActive">0</span>
                    </button>
                    <button type="button" class="task-tab" data-filter="queued">
                        <i class="bi bi-hourglass-split"></i> Queued <span class="task-tab-badge" id="countQueued">0</span>
                    </button>
                    <button type="button" class="task-tab" data-filter="completed">
                        <i class="bi bi-check-circle"></i> Completed <span class="task-tab-badge" id="countCompleted">0</span>
                    </button>
                    <button type="button" class="task-tab" data-filter="failed">
                        <i class="bi bi-exclamation-triangle"></i> Failed <span class="task-tab-badge" id="countFailed">0</span>
                    </button>
                </div>
            </div>

            <div class="task-list" id="taskList"></div>
        </section>

        <div class="platforms-wrapper">
            <span class="platform-badge"><i class="bi bi-youtube"></i> YouTube</span>
            <span class="platform-badge"><i class="bi bi-tiktok"></i> TikTok</span>
            <span class="platform-badge"><i class="bi bi-instagram"></i> Instagram</span>
            <span class="platform-badge"><i class="bi bi-twitter-x"></i> Twitter/X</span>
            <span class="platform-badge"><i class="bi bi-vimeo"></i> Vimeo</span>
        </div>
    </main>

    <footer class="app-footer">
        <p>Powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> {{ $.ytDlpVersion }}</p>
    </footer>
</div>

<script>
(function() {
    var form = document.getElementById('downloadForm');
    var urlInput = document.getElementById('urlInput');
    var submitBtn = document.getElementById('submitBtn');
    var btnText = submitBtn.querySelector('.btn-text');
    var taskList = document.getElementById('taskList');
    var matrixCanvas = document.getElementById('matrixCanvas');

    var tasksMap = {};
    var currentFilter = 'all';
    var selectedFormat = 'best';
    var currentTheme = localStorage.getItem('kv_theme') || 'simple';

    // Matrix Rain animation engine
    var ctx = matrixCanvas ? matrixCanvas.getContext('2d') : null;
    var matrixInterval = null;
    var chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    var fontSize = 14;
    var drops = [];

    function initMatrixRain() {
        if (!matrixCanvas || !ctx) return;
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        var columns = Math.floor(matrixCanvas.width / fontSize);
        drops = [];
        for (var i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * -50);
        }
    }

    function drawMatrixRain() {
        if (!ctx) return;
        ctx.fillStyle = 'rgba(3, 8, 4, 0.08)';
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = fontSize + 'px "Share Tech Mono", monospace';

        for (var i = 0; i < drops.length; i++) {
            var text = chars.charAt(Math.floor(Math.random() * chars.length));
            var x = i * fontSize;
            var y = drops[i] * fontSize;

            ctx.fillText(text, x, y);
            if (y > matrixCanvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    function startMatrixRain() {
        initMatrixRain();
        if (matrixInterval) clearInterval(matrixInterval);
        matrixInterval = setInterval(drawMatrixRain, 45);
        window.addEventListener('resize', initMatrixRain);
    }

    function stopMatrixRain() {
        if (matrixInterval) {
            clearInterval(matrixInterval);
            matrixInterval = null;
        }
        window.removeEventListener('resize', initMatrixRain);
    }

    function applyTheme(themeName) {
        currentTheme = themeName;
        document.body.classList.remove('theme-simple', 'theme-matrix');
        document.body.classList.add('theme-' + themeName);
        localStorage.setItem('kv_theme', themeName);

        var buttons = document.querySelectorAll('.btn-theme-switch');
        buttons.forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-theme') === themeName);
        });

        if (themeName === 'matrix') {
            if (matrixCanvas) matrixCanvas.classList.remove('d-none');
            startMatrixRain();
            if (btnText) btnText.textContent = '[ ENQUEUE_TASK ]';
        } else {
            if (matrixCanvas) matrixCanvas.classList.add('d-none');
            stopMatrixRain();
            if (btnText) btnText.textContent = 'Add to Queue';
        }
    }

    document.querySelectorAll('.btn-theme-switch').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var selectedTheme = this.getAttribute('data-theme');
            applyTheme(selectedTheme);
        });
    });

    document.querySelectorAll('.format-pill').forEach(function(pill) {
        pill.addEventListener('click', function() {
            document.querySelectorAll('.format-pill').forEach(function(p) { p.classList.remove('active'); });
            this.classList.add('active');
            selectedFormat = this.getAttribute('data-format');
        });
    });

    document.querySelectorAll('.task-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.task-tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentFilter = this.getAttribute('data-filter');
            renderTasks();
        });
    });

    applyTheme(currentTheme);

    function initSSE() {
        var evtSource = new EventSource('/api/events');

        evtSource.onmessage = function(e) {
            try {
                var data = JSON.parse(e.data);
                if (data.type === 'init' && Array.isArray(data.tasks)) {
                    tasksMap = {};
                    data.tasks.forEach(function(t) { tasksMap[t.id] = t; });
                    renderTasks();
                } else if (data.type === 'task_update' && data.task) {
                    tasksMap[data.task.id] = data.task;
                    renderTasks();
                } else if (data.type === 'task_deleted' && data.taskId) {
                    delete tasksMap[data.taskId];
                    renderTasks();
                }
            } catch(err) {
                console.error('SSE JSON error:', err);
            }
        };

        evtSource.onerror = function() {
            console.warn('SSE connection lost, reconnecting...');
        };
    }

    function getUrls() {
        var raw = urlInput.value.trim();
        if (!raw) return [];
        return raw.split(/\n+/).map(function(u) { return u.trim(); }).filter(function(u) { return u.length > 0; });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var urls = getUrls();
        if (urls.length === 0) return;

        submitBtn.disabled = true;
        btnText.textContent = 'Enqueuing...';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/queue/add', true);
        xhr.setRequestHeader('Content-Type', 'application/json');

        xhr.onload = function() {
            submitBtn.disabled = false;
            btnText.textContent = currentTheme === 'matrix' ? '[ ENQUEUE_TASK ]' : 'Add to Queue';
            if (xhr.status === 200) {
                urlInput.value = '';
                urlInput.style.height = 'auto';
            }
        };

        xhr.onerror = function() {
            submitBtn.disabled = false;
            btnText.textContent = currentTheme === 'matrix' ? '[ ENQUEUE_TASK ]' : 'Add to Queue';
        };

        xhr.send(JSON.stringify({
            urls: urls,
            format: selectedFormat
        }));
    });

    function cancelTask(id) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/queue/cancel?id=' + encodeURIComponent(id), true);
        xhr.send();
    }

    function retryTask(id) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/queue/retry?id=' + encodeURIComponent(id), true);
        xhr.send();
    }

    function deleteTask(id, deleteFile) {
        var xhr = new XMLHttpRequest();
        xhr.open('DELETE', '/api/queue/item?id=' + encodeURIComponent(id) + '&deleteFile=' + (deleteFile ? 'true' : 'false'), true);
        xhr.send();
    }

    function updateCounts(allTasks) {
        var cAll = allTasks.length;
        var cActive = allTasks.filter(function(t) { return t.status === 'downloading'; }).length;
        var cQueued = allTasks.filter(function(t) { return t.status === 'queued'; }).length;
        var cCompleted = allTasks.filter(function(t) { return t.status === 'completed'; }).length;
        var cFailed = allTasks.filter(function(t) { return t.status === 'failed' || t.status === 'cancelled'; }).length;

        document.getElementById('countAll').textContent = cAll;
        document.getElementById('countActive').textContent = cActive;
        document.getElementById('countQueued').textContent = cQueued;
        document.getElementById('countCompleted').textContent = cCompleted;
        document.getElementById('countFailed').textContent = cFailed;
    }

    function renderTasks() {
        var allTasks = Object.values(tasksMap);
        allTasks.sort(function(a, b) {
            return new Date(b.createdAt) - new Date(a.createdAt);
        });

        updateCounts(allTasks);

        var filtered = allTasks.filter(function(t) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'active' || currentFilter === 'downloading') return t.status === 'downloading';
            if (currentFilter === 'queued') return t.status === 'queued';
            if (currentFilter === 'completed') return t.status === 'completed';
            if (currentFilter === 'failed') return t.status === 'failed' || t.status === 'cancelled';
            return true;
        });

        taskList.innerHTML = '';

        if (filtered.length === 0) {
            var emptyState = document.createElement('div');
            emptyState.className = 'media-card';
            emptyState.style.textAlign = 'center';
            emptyState.style.padding = '32px';
            emptyState.innerHTML = '<i class="bi bi-inbox" style="font-size:2rem; opacity:0.5;"></i><p style="margin-top:8px; color:var(--text-tertiary);">No tasks found in this view.</p>';
            taskList.appendChild(emptyState);
            return;
        }

        filtered.forEach(function(t) {
            var card = document.createElement('div');
            card.className = 'task-card';
            card.id = 'task-card-' + t.id;

            var percent = Math.min(100, Math.max(0, t.percent || 0)).toFixed(1);

            var downloadUrl = t.mediaId ? ('/download?id=' + encodeURIComponent(t.mediaId)) : '#';

            var statsLine = '';
            if (t.status === 'downloading') {
                statsLine = 'Speed: ' + (t.speed || '--') + ' | ETA: ' + (t.eta || '--') + ' | ' + percent + '%';
            } else if (t.status === 'completed') {
                statsLine = 'Size: ' + (t.humanSize || 'Done');
            } else if (t.status === 'failed') {
                statsLine = 'Error: ' + escapeHtml(t.errorMessage || 'Failed');
            } else if (t.status === 'cancelled') {
                statsLine = 'Cancelled by user';
            } else {
                statsLine = 'Waiting in download queue...';
            }

            var actionsHtml = '';
            if (t.status === 'queued' || t.status === 'downloading') {
                actionsHtml += '<button type="button" class="btn-task-action btn-task-cancel" data-id="' + t.id + '"><i class="bi bi-x-circle"></i> Cancel</button>';
            }
            if (t.status === 'failed' || t.status === 'cancelled') {
                actionsHtml += '<button type="button" class="btn-task-action btn-task-retry" data-id="' + t.id + '"><i class="bi bi-arrow-counterclockwise"></i> Retry</button>';
            }
            if (t.status === 'completed') {
                actionsHtml += '<a href="' + downloadUrl + '" class="btn-task-action" download="' + escapeHtml(t.mediaName || t.title) + '"><i class="bi bi-download"></i> Save to Device</a>';
            }
            actionsHtml += '<button type="button" class="btn-task-action btn-task-delete" data-id="' + t.id + '"><i class="bi bi-trash"></i> Delete</button>';

            var videoPreviewHtml = '';
            if (t.status === 'completed' && t.mediaId) {
                videoPreviewHtml =
                    '<div class="media-preview" style="margin-top:12px; margin-bottom:12px;">' +
                        '<video controls loop playsinline class="media-video" preload="metadata">' +
                            '<source src="' + downloadUrl + '" type="video/mp4">' +
                            'Your browser does not support the video tag.' +
                        '</video>' +
                    '</div>';
            }

            card.innerHTML =
                '<div class="task-card-header">' +
                    '<div class="task-title-group">' +
                        '<i class="bi bi-film"></i>' +
                        '<span class="task-title" title="' + escapeHtml(t.url) + '">' + escapeHtml(t.title) + '</span>' +
                    '</div>' +
                    '<div class="task-badges">' +
                        '<span class="badge-format">' + escapeHtml(t.format) + '</span>' +
                        '<span class="badge-status badge-status-' + t.status + '">' + t.status + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="task-progress-track">' +
                    '<div class="task-progress-fill" style="width: ' + percent + '%;"></div>' +
                '</div>' +
                '<div class="task-stats-row">' +
                    '<span>' + statsLine + '</span>' +
                    '<span>' + percent + '%</span>' +
                '</div>' +
                videoPreviewHtml +
                '<div class="task-actions">' + actionsHtml + '</div>';

            taskList.appendChild(card);
        });

        // Event Listeners for Task Actions
        document.querySelectorAll('.btn-task-cancel').forEach(function(btn) {
            btn.addEventListener('click', function() { cancelTask(this.getAttribute('data-id')); });
        });
        document.querySelectorAll('.btn-task-retry').forEach(function(btn) {
            btn.addEventListener('click', function() { retryTask(this.getAttribute('data-id')); });
        });
        document.querySelectorAll('.btn-task-delete').forEach(function(btn) {
            btn.addEventListener('click', function() { deleteTask(this.getAttribute('data-id'), true); });
        });
    }

    function escapeHtml(text) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(text || ''));
        return d.innerHTML;
    }

    urlInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    initSSE();
})();
</script>
</body>
</html>

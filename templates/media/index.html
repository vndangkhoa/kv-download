<!doctype html>
<html lang="en">
<head>
    <title>KV Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Download videos from YouTube, TikTok, Instagram, Twitter/X, Vimeo and more">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-simple">

<canvas id="matrixCanvas" class="matrix-canvas d-none"></canvas>

<div class="app-container">
    <div class="top-nav">
        <div class="brand">
            <img src="/static/logo.svg" alt="KV Download" width="32" height="32" class="app-logo">
            <span class="brand-name">KV Download</span>
        </div>
        <div class="theme-switch-group">
            <button type="button" class="btn-theme-switch active" data-theme="simple">
                <i class="bi bi-moon-stars-fill"></i> Simple
            </button>
            <button type="button" class="btn-theme-switch" data-theme="matrix">
                <i class="bi bi-terminal-fill"></i> Matrix
            </button>
        </div>
    </div>

    <main class="main-content">
        <form class="url-form" id="downloadForm">
            <div class="glass-card">
                <div class="glass-input">
                    <div class="input-icon">
                        <i class="bi bi-link-45deg"></i>
                    </div>
                    <textarea name="url" class="url-input"
                              placeholder="Paste video URL(s) here... one per line" rows="1"
                              id="urlInput" autofocus></textarea>
                    <button class="btn-download" type="submit" id="submitBtn">
                        <i class="bi bi-download"></i>
                        <span class="btn-text">Fetch Videos</span>
                    </button>
                </div>
            </div>
        </form>

        <div class="progress-container d-none" id="progressContainer">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-info">
                <span class="progress-label" id="progressLabel">Preparing download...</span>
                <span class="progress-timer" id="progressTimer">0:00</span>
            </div>
            <div class="stepper-bar" id="stepperBar">
                <div class="step-item" id="step1"><span class="step-number">1</span><span>Fetch Link</span></div>
                <div class="step-line" id="line1"></div>
                <div class="step-item" id="step2"><span class="step-number">2</span><span>Download</span></div>
                <div class="step-line" id="line2"></div>
                <div class="step-item" id="step3"><span class="step-number">3</span><span>Play & Save</span></div>
            </div>
            <div class="download-queue" id="downloadQueue"></div>
        </div>

        <div class="selection-section d-none" id="selectionSection">
            <div class="selection-bar">
                <div class="selection-count">
                    <i class="bi bi-collection-play"></i>
                    <span id="selectionCountText">0 videos found</span>
                </div>
                <div class="selection-actions">
                    <button type="button" class="btn-select-toggle" id="btnSelectToggle">Deselect All</button>
                    <button type="button" class="btn-start-download" id="btnStartDownload">
                        <i class="bi bi-download"></i>
                        <span id="btnStartDownloadText">Download Selected (0)</span>
                    </button>
                </div>
            </div>
            <div class="selection-grid" id="selectionGrid"></div>
        </div>

        <div class="platforms-wrapper">
            <span class="platform-badge"><i class="bi bi-youtube"></i> YouTube</span>
            <span class="platform-badge"><i class="bi bi-tiktok"></i> TikTok</span>
            <span class="platform-badge"><i class="bi bi-instagram"></i> Instagram</span>
            <span class="platform-badge"><i class="bi bi-twitter-x"></i> Twitter/X</span>
            <span class="platform-badge"><i class="bi bi-vimeo"></i> Vimeo</span>
        </div>
    </main>

    <section class="results-section d-none" id="resultsSection">
        <div class="section-header">
            <div class="header-left">
                <i class="bi bi-check-circle-fill"></i>
                <h2>Download Complete</h2>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-go-back d-none" id="btnGoBack" title="Return to video selection grid">
                    <i class="bi bi-arrow-left"></i> Select More Videos
                </button>
                <button class="btn-download-all d-none" id="downloadAllBtn" title="Download all videos as a ZIP">
                    <i class="bi bi-folder-zip"></i> Download All
                </button>
            </div>
        </div>
        <div class="media-grid" id="mediaGrid"></div>
    </section>

    <section class="error-section d-none" id="errorSection">
        <div class="error-card">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <h4>Download Failed</h4>
            <pre id="errorText"></pre>
        </div>
    </section>

    <footer class="app-footer">
        <p>Powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a> {{ $.ytDlpVersion }}</p>
    </footer>
</div>

<script>
(function() {
    var form = document.getElementById('downloadForm');
    var urlInput = document.getElementById('urlInput');
    var submitBtn = document.getElementById('submitBtn');
    var btnText = submitBtn.querySelector('.btn-text');
    var progressContainer = document.getElementById('progressContainer');
    var progressFill = document.getElementById('progressFill');
    var progressLabel = document.getElementById('progressLabel');
    var progressTimer = document.getElementById('progressTimer');
    var downloadQueue = document.getElementById('downloadQueue');
    var selectionSection = document.getElementById('selectionSection');
    var selectionCountText = document.getElementById('selectionCountText');
    var btnSelectToggle = document.getElementById('btnSelectToggle');
    var btnStartDownload = document.getElementById('btnStartDownload');
    var btnStartDownloadText = document.getElementById('btnStartDownloadText');
    var selectionGrid = document.getElementById('selectionGrid');
    var resultsSection = document.getElementById('resultsSection');
    var mediaGrid = document.getElementById('mediaGrid');
    var downloadAllBtn = document.getElementById('downloadAllBtn');
    var btnGoBack = document.getElementById('btnGoBack');
    var errorSection = document.getElementById('errorSection');
    var errorText = document.getElementById('errorText');

    var matrixCanvas = document.getElementById('matrixCanvas');

    var scannedEntries = [];
    var mediaIds = [];
    var currentTheme = localStorage.getItem('kv_theme') || 'simple';

    var timerInterval = null;
    var startTime = null;

    // Matrix Rain animation engine
    var ctx = matrixCanvas ? matrixCanvas.getContext('2d') : null;
    var matrixInterval = null;
    var chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    var fontSize = 14;
    var drops = [];

    function initMatrixRain() {
        if (!matrixCanvas || !ctx) return;
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        var columns = Math.floor(matrixCanvas.width / fontSize);
        drops = [];
        for (var i = 0; i < columns; i++) {
            drops[i] = Math.floor(Math.random() * -50);
        }
    }

    function drawMatrixRain() {
        if (!ctx) return;
        ctx.fillStyle = 'rgba(3, 8, 4, 0.08)';
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = '#00ff66';
        ctx.font = fontSize + 'px "Share Tech Mono", monospace';

        for (var i = 0; i < drops.length; i++) {
            var text = chars.charAt(Math.floor(Math.random() * chars.length));
            var x = i * fontSize;
            var y = drops[i] * fontSize;

            ctx.fillText(text, x, y);
            if (y > matrixCanvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    function startMatrixRain() {
        initMatrixRain();
        if (matrixInterval) clearInterval(matrixInterval);
        matrixInterval = setInterval(drawMatrixRain, 45);
        window.addEventListener('resize', initMatrixRain);
    }

    function stopMatrixRain() {
        if (matrixInterval) {
            clearInterval(matrixInterval);
            matrixInterval = null;
        }
        window.removeEventListener('resize', initMatrixRain);
    }

    function applyTheme(themeName) {
        currentTheme = themeName;
        document.body.classList.remove('theme-simple', 'theme-matrix');
        document.body.classList.add('theme-' + themeName);
        localStorage.setItem('kv_theme', themeName);

        var buttons = document.querySelectorAll('.btn-theme-switch');
        buttons.forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-theme') === themeName);
        });

        if (themeName === 'matrix') {
            if (matrixCanvas) matrixCanvas.classList.remove('d-none');
            startMatrixRain();
            if (btnText && btnText.textContent === 'Fetch Videos') btnText.textContent = '[ INITIATE_DOWNLOAD ]';
        } else {
            if (matrixCanvas) matrixCanvas.classList.add('d-none');
            stopMatrixRain();
            if (btnText && btnText.textContent === '[ INITIATE_DOWNLOAD ]') btnText.textContent = 'Fetch Videos';
        }
    }

    document.querySelectorAll('.btn-theme-switch').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var selectedTheme = this.getAttribute('data-theme');
            applyTheme(selectedTheme);
        });
    });

    applyTheme(currentTheme);

    function updateStepper(step) {
        for (var i = 1; i <= 3; i++) {
            var stepEl = document.getElementById('step' + i);
            var lineEl = document.getElementById('line' + (i - 1));
            if (stepEl) {
                stepEl.classList.remove('active', 'completed');
                if (i < step) stepEl.classList.add('completed');
                else if (i === step) stepEl.classList.add('active');
            }
            if (lineEl) {
                lineEl.classList.remove('completed');
                if (i <= step) lineEl.classList.add('completed');
            }
        }
    }

    function formatTime(sec) {
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function startTimer() {
        stopTimer(false);
        startTime = Date.now();
        progressTimer.textContent = '0:00';
        timerInterval = setInterval(function() {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            progressTimer.textContent = formatTime(elapsed);
        }, 1000);
    }

    function stopTimer(isComplete) {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        if (isComplete && startTime) {
            var elapsed = Math.floor((Date.now() - startTime) / 1000);
            progressTimer.textContent = 'Done (' + formatTime(elapsed) + ')';
        }
    }

    function updateOverallProgress(completed, total) {
        var pct = total === 0 ? 0 : (completed / total) * 100;
        progressFill.style.width = pct + '%';
        progressLabel.textContent = completed + ' of ' + total + ' done';
    }

    function getUrls() {
        var raw = urlInput.value.trim();
        if (!raw) return [];
        return raw.split(/\n+/).map(function(u) { return u.trim(); }).filter(function(u) { return u.length > 0; });
    }

    function shortenUrl(url) {
        try {
            var u = new URL(url);
            var path = u.pathname + u.search;
            if (path.length > 40) path = path.substring(0, 37) + '...';
            return u.hostname + path;
        } catch(e) {
            return url.length > 45 ? url.substring(0, 42) + '...' : url;
        }
    }

    function addQueueItem(index, url) {
        var item = document.createElement('div');
        item.className = 'queue-item';
        item.id = 'queue-item-' + index;
        item.innerHTML =
            '<div class="queue-icon queue-pending"><i class="bi bi-hourglass-split"></i></div>' +
            '<div class="queue-details">' +
                '<span class="queue-url" title="' + escapeHtml(url) + '">' + escapeHtml(shortenUrl(url)) + '</span>' +
                '<span class="queue-status">Waiting...</span>' +
            '</div>';
        downloadQueue.appendChild(item);
        return item;
    }

    function setQueueItemStatus(index, status, message) {
        var item = document.getElementById('queue-item-' + index);
        if (!item) return;
        var icon = item.querySelector('.queue-icon');
        var statusEl = item.querySelector('.queue-status');

        icon.className = 'queue-icon';
        if (status === 'scanning' || status === 'loading') {
            icon.classList.add('queue-loading');
            icon.innerHTML = '<div class="spinner"></div>';
            statusEl.textContent = 'Fetching video file...';
            statusEl.className = 'queue-status';
        } else if (status === 'done') {
            icon.classList.add('queue-done');
            icon.innerHTML = '<i class="bi bi-check-lg"></i>';
            statusEl.textContent = message || 'Done';
            statusEl.className = 'queue-status queue-status-done';
        } else if (status === 'error') {
            icon.classList.add('queue-error');
            icon.innerHTML = '<i class="bi bi-x-lg"></i>';
            statusEl.textContent = message || 'Failed';
            statusEl.className = 'queue-status queue-status-error';
        }
    }

    function appendSingleMediaCard(m) {
        if (!m || !m.Id) return;
        mediaIds.push(m.Id);
        var card = document.createElement('div');
        card.className = 'media-card';

        var downloadUrl = '/download?id=' + encodeURIComponent(m.Id);

        card.innerHTML =
            '<div class="media-preview">' +
                '<video controls loop playsinline class="media-video" preload="metadata">' +
                    '<source src="' + downloadUrl + '" type="video/mp4">' +
                    'Your browser does not support the video tag.' +
                '</video>' +
            '</div>' +
            '<div class="media-info">' +
                '<h5 class="media-name" title="' + escapeHtml(m.Name) + '"><i class="bi bi-film"></i> ' + escapeHtml(m.Name) + '</h5>' +
                '<div class="media-meta">' +
                    '<span class="media-size"><i class="bi bi-hdd"></i> ' + escapeHtml(m.HumanSize) + '</span>' +
                    '<a href="' + downloadUrl + '" class="btn-save" download="' + escapeHtml(m.Name) + '">' +
                        '<i class="bi bi-download"></i> Save' +
                    '</a>' +
                '</div>' +
            '</div>';

        mediaGrid.appendChild(card);

        if (mediaIds.length > 1) {
            downloadAllBtn.classList.remove('d-none');
        }

        // Un-hide results section ONLY when a video card is ready!
        resultsSection.classList.remove('d-none');
    }

    function appendErrorMediaCard(url, errorMsg) {
        var errCard = document.createElement('div');
        errCard.className = 'media-card media-card-error';
        errCard.innerHTML =
            '<div class="media-info">' +
                '<h5 class="media-name"><i class="bi bi-exclamation-triangle"></i> ' + escapeHtml(url || 'Unknown URL') + '</h5>' +
                '<div class="media-error-log"><pre>' + escapeHtml(errorMsg) + '</pre></div>' +
            '</div>';
        mediaGrid.appendChild(errCard);
        resultsSection.classList.remove('d-none');
    }

    function escapeHtml(text) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(text || ''));
        return d.innerHTML;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var urls = getUrls();
        if (urls.length === 0) return;
        startFlow(urls);
    });

    function startFlow(urls) {
        var items = urls.map(function(u) { return { url: u }; });
        downloadUrls(items);
    }

    function downloadUrls(items) {
        updateStepper(1);
        submitBtn.disabled = true;
        btnText.textContent = 'Fetching...';

        progressContainer.classList.remove('d-none');
        selectionSection.classList.add('d-none');
        resultsSection.classList.add('d-none');
        errorSection.classList.add('d-none');
        downloadQueue.innerHTML = '';
        mediaGrid.innerHTML = '';
        mediaIds = [];
        downloadAllBtn.classList.add('d-none');
        btnGoBack.classList.add('d-none');

        startTimer();

        var completed = 0;
        var total = items.length;
        var hasErrors = false;
        var errorLogs = [];

        progressFill.style.width = '0%';
        progressLabel.textContent = '0 of ' + total + ' done';

        items.forEach(function(item, i) { addQueueItem(i, item.url); });

        function fetchNext() {
            if (completed >= total) {
                progressFill.style.width = '100%';
                progressLabel.textContent = 'All done';
                stopTimer(true);
                updateStepper(3);
                submitBtn.disabled = false;
                btnText.textContent = currentTheme === 'matrix' ? '[ INITIATE_DOWNLOAD ]' : 'Fetch Videos';

                if (mediaIds.length === 0 && hasErrors) {
                    errorText.textContent = errorLogs.join('\n\n');
                    errorSection.classList.remove('d-none');
                }
                return;
            }

            var idx = completed;
            var item = items[idx];
            setQueueItemStatus(idx, 'loading');
            updateStepper(2);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/info?url=' + encodeURIComponent(item.url), true);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

            xhr.onload = function() {
                completed++;
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.media && data.media.length > 0) {
                            setQueueItemStatus(idx, 'done', data.media.length + ' file(s)');
                            data.media.forEach(function(m) {
                                appendSingleMediaCard(m);
                            });
                        } else if (data.error) {
                            hasErrors = true;
                            errorLogs.push(data.error);
                            setQueueItemStatus(idx, 'error', data.error);
                            appendErrorMediaCard(item.url, data.error);
                        } else {
                            setQueueItemStatus(idx, 'done');
                        }
                    } catch(err) {
                        hasErrors = true;
                        errorLogs.push('Invalid JSON response');
                        setQueueItemStatus(idx, 'error', 'Invalid response');
                        appendErrorMediaCard(item.url, 'Parse error');
                    }
                } else {
                    hasErrors = true;
                    var errMsg = 'Download failed';
                    try {
                        var errData = JSON.parse(xhr.responseText);
                        if (errData.error) errMsg = errData.error;
                    } catch(ex) {
                        if (xhr.responseText && xhr.responseText.trim()) errMsg = xhr.responseText.trim();
                    }
                    errorLogs.push(errMsg);
                    setQueueItemStatus(idx, 'error', errMsg);
                    appendErrorMediaCard(item.url, errMsg);
                }
                updateOverallProgress(completed, total);
                fetchNext();
            };

            xhr.onerror = function() {
                completed++;
                hasErrors = true;
                var errMsg = 'Network error';
                if (xhr.responseText && xhr.responseText.trim()) {
                    errMsg = xhr.responseText.trim();
                }
                errorLogs.push(errMsg);
                setQueueItemStatus(idx, 'error', errMsg);
                appendErrorMediaCard(item.url, errMsg);
                updateOverallProgress(completed, total);
                fetchNext();
            };

            xhr.send();
        }

        fetchNext();
    }

    downloadAllBtn.addEventListener('click', function() {
        if (mediaIds.length === 0) return;
        var url = '/download/zip?' + mediaIds.map(function(id) {
            return 'id=' + encodeURIComponent(id);
        }).join('&');
        window.location.href = url;
    });

    urlInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
})();
</script>
</body>
</html>
